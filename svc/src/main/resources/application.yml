server:
  port: 10610 #服务端口
spring:
  application:
    name: bizlens-ai
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

logging:
  level:
    org:
      springframework:
        security: info

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  type-aliases-package: zzz.service.**.domain

# ============ AI 对话配置（密钥走环境变量，不提交到 Git） ============
ai:
  provider: deepseek
  deepseek:
    base-url: https://api.deepseek.com
    # 角色未指定模型时的兜底模型。
    # 注意：deepseek-chat / deepseek-reasoner 两个别名已于 2026-07-24 下线，调用会直接报错，勿再使用。
    model: deepseek-flash
  # 模型下拉的兜底列表：仅当厂商 /models 调用失败（无 Key、Key 失效、网关不通）时才展示。
  # 模型名迭代很快，改名只需改这里、不需要重新编译；未列出的厂商不给兜底（下拉为空但可手输）。
  # 最近一次人工核对：2026-09-14
  preset-models:
    deepseek:
      - deepseek-flash
      - deepseek-v4-pro
    openai:
      - gpt-6-astra
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna
    qwen:
      - qwen-max
      - qwen-plus
      - qwen-turbo

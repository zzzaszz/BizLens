server:
  tomcat:
    uri-encoding: UTF-8
#spring数据源
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    compatibility-verifier:
      enabled: false  # 禁用兼容性检查(springboot和springcloud版本不兼容)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://192.168.99.240:55432/bizLens}
    username: ${DATABASE_USERNAME:appuser}
    password: ${DATABASE_PASSWORD:inks_240!}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 5
  redis:
    database: 0
    host: ${REDIS_HOST:192.168.99.240}
    port: ${REDIS_PORT:56379}
    password: ${REDIS_PASSWORD:asd@123456}
        # 连接池最大连接数（使用负值表示没有限制）
    jedis:
      pool:
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制） 表示连接池的链接拿完了 现在去申请需要等待的时间
        max-wait: -1
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0
    # 连接超时时间（毫秒） 去链接redis服务端
    timeout: 6000
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  type-aliases-package: zzz.service.forum.domain
  #配置打印SQL语句到控制台


